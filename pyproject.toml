[project]
name = "knittingproject"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "drjit>=1.3.1",
    "glfw>=2.10.0",
    "imgui-bundle>=1.92.801",
    # Yarn simulation collision barriers. >=1.6 for the API the solver targets.
    "ipctk>=1.6.0",
    "jax>=0.10.1",
    "mitsuba>=3.8.0",
    "moderngl>=5.12.0",
    "numpy>=2.4.6",
    "optax>=0.2.8",
    "pillow>=12.2.0",
    "pyopengl>=3.1.10",
    "scipy>=1.17.1",
    "ur-rtde>=1.6.0",
    "vedo>=2026.6.1",
    "vtk>=9.6.2",
    # The MuJoCo UR5e every capture path is solved and collision-checked against.
    "mujoco>=3.2.7",
    "robot-descriptions>=3.2.0",
    # UR5 Robot Mode's default transport speaks gRPC to CraftLabXRFleet's TeleopApp, whose
    # robot.proto stubs are regenerated into that checkout on connect. Generated stubs refuse
    # an older runtime than produced them, so these move together, at that project's floor.
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "protobuf>=6.33.0",
    # The per-capture fabric check runs MobileSAM's ONNX graphs on the CPU.
    "onnxruntime>=1.20.0",
]

# Installed by every `uv sync`. Without it `uv run pytest` falls through to whatever pytest is
# on PATH - another Python, with none of this project's packages.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]; sys_platform == 'linux'",
]
# UR5 Robot Mode's gripper camera. Without it the mode still runs, on clearly
# marked synthetic frames; with it, real cameras can be opened.
camera = [
    "opencv-python>=4.10.0",
    # Friendly device names (e.g. "2K HD Camera") in the picker, Windows only.
    "pygrabber>=0.2; sys_platform == 'win32'",
]
